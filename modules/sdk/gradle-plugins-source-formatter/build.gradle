import com.liferay.gradle.plugins.defaults.tasks.ReplaceRegexTask

import com.pswidersk.gradle.python.VenvTask

buildscript {
	dependencies {
		classpath group: "com.pswidersk", name: "python-gradle-plugin", version: "1.2.1"
	}

	repositories {
		mavenLocal()

		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "com.gradle.plugin-publish"
apply plugin: "com.pswidersk.python-plugin"
apply plugin: "org.ysb33r.gradletest"

task copyGradleTestDependencies(type: Copy)
task pythonBlack(type: VenvTask)
task pythonBlackInstall(type: VenvTask)
task updateReadme(type: ReplaceRegexTask)

String gradleVersion = "5.6.4"

tasks.eclipse {
	ext.gradleVersion = gradleVersion
}

copyGradleTestDependencies {
	from configurations.compile
	into jar.destinationDir
}

dependencies {
	compile group: "com.liferay", name: "com.liferay.gradle.util", version: "1.0.43"

	compileOnly fileTree(builtBy: [rootProject.tasks.getByName("extractGradleApi" + gradleVersion.replace(".", ""))], dir: new File(rootProject.buildDir, "gradle-${gradleVersion}"))
	compileOnly group: "com.liferay", name: "com.liferay.source.formatter", version: "1.0.1059"
}

gradleTest {
	dependsOn copyGradleTestDependencies
	dependsOn jar

	versions gradleVersion
}

pluginBundle {
	tags = ["java", "style"]
}

pythonBlack {
	dependsOn pythonBlackInstall

	args = ["--fast", projectDir.parentFile]
	venvExec = "black"
}

pythonBlackInstall {
	args = ["install", "black"]
	venvExec = "pip"
}

updateReadme {
	match(/group: "com\.liferay", name: "com\.liferay\.gradle\.plugins\.source\.formatter", version: "(\d.+)"/, "README.markdown")

	onlyIf {
		!project.version.endsWith("-SNAPSHOT")
	}

	replacement = {
		project.version
	}
}

uploadArchives {
	dependsOn updateReadme
}